name: Repository health check

# This workflow validates committed public files only.
# It does NOT measure ONNX latency or connect to the music workstation.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - scripts/check_repository.py
      - Sovereign_Audio_Intelligence_Engine.ipynb
      - audio_deep_dive_report.parquet
      - .github/workflows/perf-audit.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'

permissions:
  contents: read

jobs:
  repository-check:
    name: Validate public documentation and sample files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run the read-only repository checks
        run: python scripts/check_repository.py
